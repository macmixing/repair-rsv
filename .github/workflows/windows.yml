name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
      - run: scripts/build-windows-engine.sh
      - uses: actions/upload-artifact@v4
        with:
          name: untrunc-rsv-exe
          path: bin/untrunc-rsv.exe

  app:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: untrunc-rsv-exe
          path: bin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npx tauri build
      - name: Smoke test engine
        shell: pwsh
        run: |
          & bin\untrunc-rsv.exe -V
          if ($LASTEXITCODE -lt 0) { exit 1 }  # crash = negative NTSTATUS
          exit 0
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable\bin | Out-Null
          Copy-Item "app\src-tauri\target\release\repair-rsv.exe" "portable\Repair RSV.exe"
          Copy-Item bin\untrunc-rsv.exe portable\bin\
          Compress-Archive -Path portable\* -DestinationPath Repair-RSV-windows-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Repair-RSV-windows
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            Repair-RSV-windows-x64-portable.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            Repair-RSV-windows-x64-portable.zip
