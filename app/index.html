<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repair RSV</title>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Sony RSV Recovery</p>
          <h1>Repair RSV</h1>
        </div>
        <div id="statePill" class="state-pill">Ready</div>
      </section>

      <section class="drop-grid" aria-label="Repair inputs">
        <button id="brokenDrop" class="drop-zone" type="button">
          <span class="label">Broken RSV</span>
          <span id="brokenIcon" class="drop-icon" aria-hidden="true">
            <svg class="icon icon-plus" viewBox="0 0 64 64" focusable="false">
              <path d="M32 4a28 28 0 1 0 0 56 28 28 0 0 0 0-56Zm0 5a23 23 0 1 1 0 46 23 23 0 0 1 0-46Zm2.5 10.5h-5v10h-10v5h10v10h5v-10h10v-5h-10v-10Z" />
            </svg>
            <svg class="icon icon-document" viewBox="0 0 64 64" focusable="false">
              <path d="M16 6h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Zm21 4v11h11L37 10Z" />
            </svg>
          </span>
          <span id="brokenPath" class="path">Drop .RSV file or click to browse</span>
        </button>
        <button id="donorDrop" class="drop-zone" type="button">
          <span class="label">Donor Clip</span>
          <span id="donorIcon" class="drop-icon" aria-hidden="true">
            <svg class="icon icon-plus" viewBox="0 0 64 64" focusable="false">
              <path d="M32 4a28 28 0 1 0 0 56 28 28 0 0 0 0-56Zm0 5a23 23 0 1 1 0 46 23 23 0 0 1 0-46Zm2.5 10.5h-5v10h-10v5h10v10h5v-10h10v-5h-10v-10Z" />
            </svg>
            <svg class="icon icon-document" viewBox="0 0 64 64" focusable="false">
              <path d="M16 6h22l14 14v34a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4Zm21 4v11h11L37 10Z" />
            </svg>
          </span>
          <span id="donorPath" class="path">Drop donor video or click to browse</span>
        </button>
      </section>

      <section class="status-panel" aria-live="polite">
        <div class="progress-row">
          <div class="progress-track">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <span id="progressText" class="progress-text">0%</span>
        </div>
        <p id="statusText" class="status-text">Select a broken RSV file and a donor clip.</p>
        <p id="outputPath" class="output-path"></p>
      </section>

      <section class="actions">
        <button id="repairButton" class="primary" type="button" disabled>Repair</button>
        <button id="cancelButton" class="secondary" type="button" disabled>Cancel</button>
        <button id="revealButton" class="secondary" type="button" disabled>Reveal Output</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
